[package]
name = "voxi"
version = "0.0.0"
description = "Organize files from a typed or dictated command"
homepage = "https://tryvoxi.vercel.app"
authors = ["Voxi"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name.
name = "voxi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
tiny-model = ["dep:voxi-tiny-native"]

[dependencies]
libc = "=0.2.191"
voxi-tiny-native = { path = "../../crates/voxi-tiny-native", optional = true }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
regex-syntax = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
minisign-verify = "0.3"
semver = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL", "NSGeometry", "NSFileManager", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSWindow", "NSResponder", "NSTextCheckingClient", "NSAnimation", "NSAnimationContext", "NSEvent", "NSApplication", "NSPasteboard", "NSPasteboardItem", "block2"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebViewConfiguration"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "PDFPage", "objc2-app-kit"] }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "search"
harness = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Keep native CPU inference responsive while the app itself remains debuggable.
[profile.dev.package.voxi-tiny-native]
opt-level = 3
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.tokenizers]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.pulp]
opt-level = 3
[profile.dev.package.rayon]
opt-level = 3
[profile.dev.package.rayon-core]
opt-level = 3
