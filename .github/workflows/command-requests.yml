name: Voxi feedback

# Folds queued feedback comments into their tracking checklists.
# Run it once by hand to create and lock any missing issues.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
  schedule:
    # Safety net for anything a failed run left queued.
    - cron: "17 */6 * * *"

permissions:
  contents: read
  issues: write

jobs:
  fold:
    if: >-
      github.event_name != 'issue_comment' || (
        github.event.comment.user.login == (vars.COMMAND_REQUESTS_AUTHOR || github.repository_owner) && (
          (
            contains(github.event.issue.labels.*.name, 'command-requests') &&
            startsWith(github.event.comment.body, '<!-- voxi-command-request:')
          ) || (
            contains(github.event.issue.labels.*.name, 'wrong-results') &&
            startsWith(github.event.comment.body, '<!-- voxi-wrong-result:')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One fold at a time. A newer queued run replaces an older queued one, which
    # is safe because every run folds all queued comments. On the job, not the
    # workflow: skipped runs (any other comment on the repo) never join the
    # group, so they can't cancel a pending fold.
    concurrency:
      group: command-requests
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /website/api/
            /website/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/fold-command-requests.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUEST_AUTHOR: ${{ vars.COMMAND_REQUESTS_AUTHOR || github.repository_owner }}
