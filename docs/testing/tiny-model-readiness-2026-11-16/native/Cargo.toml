[package]
name = "voxi-tiny-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "voxi_tiny_native"
path = "src/lib.rs"

[[bin]]
name = "voxi-tiny-native"
path = "src/main.rs"

[dependencies]
candle-core = "0.11.1"
candle-transformers = "0.11.1"
tokenizers = { version = "0.21.4", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12"
sha2 = "0.10.9"

