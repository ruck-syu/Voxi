name: Release

# Docs and website-only changes skip CI. The audits that read docs/testing are #[ignore] tests CI never runs.
on:
  pull_request:
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**.md"
      - ".claude/**"
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**.md"
      - ".claude/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto derives from commits since the last tag)"
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# All Cargo invocations, including those made by Tauri, share this directory.
env:
  CARGO_TARGET_DIR: /tmp/voxi-target-final
  VOXI_PLAN_MODEL_DIR: ""
  VOXI_TINY_MODEL_DIR: ""

jobs:
  quality:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # Node 22 LTS and stable Rust match the PR gates; npm/Cargo resolution is locked.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: npm ci
      - run: node scripts/check-versions.mjs
      - run: node --test scripts/next-version.test.mjs
      - run: npm run lint
      - run: npm run test:finder-handoff
      - run: npm run build
      # Unset (rather than empty) model env vars for the no-weights feature suite.
      - name: Default tests
        working-directory: app/src-tauri
        run: env -u VOXI_PLAN_MODEL_DIR -u VOXI_TINY_MODEL_DIR cargo test --locked --lib
      - name: Experimental feature tests without weights
        working-directory: app/src-tauri
        run: env -u VOXI_PLAN_MODEL_DIR -u VOXI_TINY_MODEL_DIR cargo test --locked --lib --features tiny-model
      - name: Rule-only cross-build equivalence
        working-directory: app/src-tauri
        run: env -u VOXI_PLAN_MODEL_DIR -u VOXI_TINY_MODEL_DIR cargo test --locked --test rule_only_equivalence
      - name: Experimental rule-only cross-build equivalence
        working-directory: app/src-tauri
        run: env -u VOXI_PLAN_MODEL_DIR -u VOXI_TINY_MODEL_DIR cargo test --locked --test rule_only_equivalence --features tiny-model
      - name: Rust formatting
        working-directory: app/src-tauri
        run: cargo fmt --check
      - name: Strict Clippy
        working-directory: app/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Strict experimental feature Clippy
        working-directory: app/src-tauri
        run: cargo clippy --locked --all-targets --features tiny-model -- -D warnings

  # Release only when shipped code changed since the last release tag (and not
  # marked [skip release]). Workflow, docs and other repo-only edits pass CI
  # without a new version. A manual run (workflow_dispatch) always releases.
  changes:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
      bump: ${{ steps.plan.outputs.bump }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
        run: |
          git fetch --force --tags --quiet origin
          node app/scripts/next-version.mjs \
            --event "$EVENT" \
            --bump "$BUMP" \
            --github-output "$GITHUB_OUTPUT"

  release:
    needs: [quality, changes]
    if: needs.changes.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci

      - name: Assign one release version to all manifests and lockfiles
        id: version
        # Single source of truth in app/scripts/next-version.mjs. Release tags
        # only exist once a release is published, so PR runs and failed runs
        # never use up a version.
        env:
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
        run: |
          git fetch --force --tags --quiet origin
          node scripts/next-version.mjs \
            --event "$EVENT" \
            --bump "$BUMP" \
            --require-release \
            --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT" \
            --write-notes "$RUNNER_TEMP/voxi-release-notes.md" \
            --write-updater-notes "$RUNNER_TEMP/voxi-updater-notes.md"
      - name: Stamp release version across manifests and lockfiles
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/check-versions.mjs --set "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Developer ID mode (all APPLE_* secrets set): sign, notarize, staple.
      # Self-signed mode (no APPLE_* secrets): sign with the stable "Voxi
      # Self-Signed" identity from VOXI_SIGNING_CERT so macOS keeps folder
      # access across updates, but skip notarization. Partial sets fail.
      - name: Require signing and updater credentials
        env:
          VOXI_SIGNING_CERT: ${{ secrets.VOXI_SIGNING_CERT }}
          VOXI_SIGNING_CERT_PASSWORD: ${{ secrets.VOXI_SIGNING_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          for name in VOXI_SIGNING_CERT VOXI_SIGNING_CERT_PASSWORD TAURI_SIGNING_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required release secret $name is missing"
              exit 1
            fi
          done
          # An unencrypted updater key may intentionally have an empty password.
          APPLE_NAMES=(APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8)
          SET=0
          for name in "${APPLE_NAMES[@]}"; do [[ -n "${!name}" ]] && SET=$((SET + 1)); done
          if (( SET == ${#APPLE_NAMES[@]} )); then
            [[ "$APPLE_SIGNING_IDENTITY" == "Developer ID Application: "*" ($APPLE_TEAM_ID)" ]]
            echo "NOTARIZE=true" >> "$GITHUB_ENV"
          elif (( SET == 0 )); then
            echo "::warning::No Apple Developer ID secrets; signing with the self-signed identity without notarization. Gatekeeper will warn first-time users."
            APPLE_SIGNING_IDENTITY="Voxi Self-Signed"
            echo "NOTARIZE=false" >> "$GITHUB_ENV"
          else
            for name in "${APPLE_NAMES[@]}"; do [[ -z "${!name}" ]] && echo "::error::Release secret $name is missing; set all Apple secrets or none"; done
            exit 1
          fi
          echo "SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          umask 077
          KC="$RUNNER_TEMP/voxi-signing.keychain-db"
          security list-keychains -d user > "$RUNNER_TEMP/voxi-original-keychains"
          KC_PASSWORD=$(openssl rand -base64 32)
          echo "::add-mask::$KC_PASSWORD"
          printf '%s' "$VOXI_SIGNING_CERT" | base64 --decode > "$RUNNER_TEMP/voxi-signing.p12"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/voxi-notary.p8"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/voxi-signing.p12" -k "$KC" -P "$VOXI_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KC" > /dev/null
          # Search only this keychain: an unrelated runner identity cannot satisfy signing.
          security list-keychains -d user -s "$KC"
          # A self-signed identity is not trusted on the runner, so -v would hide it.
          if [[ "$SET" -gt 0 ]]; then VALID=-v; else VALID=; fi
          security find-identity $VALID -p codesigning "$KC" | grep -F "\"$APPLE_SIGNING_IDENTITY\""
          rm "$RUNNER_TEMP/voxi-signing.p12"
          if [[ "$SET" -gt 0 ]]; then echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/voxi-notary.p8" >> "$GITHUB_ENV"; else rm "$RUNNER_TEMP/voxi-notary.p8"; fi

      # npm pins tauri-cli 2.12.4 (bundler 2.10.4). Its API-key contract is
      # APPLE_API_KEY + APPLE_API_ISSUER + APPLE_API_KEY_PATH, verified in:
      # https://github.com/tauri-apps/tauri/blob/tauri-cli-v2.12.4/crates/tauri-bundler/src/bundle/macos/sign.rs
      # It notarizes/staples the app before producing the updater tarball/DMG.
      # The DMG is separately notarized below; no --skip-stapling is permitted.
      # No custom entitlements: this is a non-sandboxed Developer ID app.
      # File access and LaunchAgent login registration need no sandbox grants;
      # spawning Apple-signed ditto/mv/sips needs no disable-library-validation.
      # WKWebView's JS runs in Apple's separate WebContent process, not Voxi:
      # https://v2.tauri.app/concept/process-model/
      # No host JIT, unsigned-executable-memory, debugger, or sandbox exceptions.
      - name: Build signed, rule-only universal bundles (notarized in Developer ID mode)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export APPLE_SIGNING_IDENTITY="$SIGNING_IDENTITY"
          # Tauri notarizes whenever these are present, even if empty.
          if [[ "$NOTARIZE" != true ]]; then unset APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH; fi
          node scripts/check-versions.mjs
          (cd src-tauri && cargo tree --locked --no-default-features --edges normal --prefix none) > "$RUNNER_TEMP/voxi-release-dependencies.txt"
          if grep -q '^voxi-tiny-native v' "$RUNNER_TEMP/voxi-release-dependencies.txt"; then
            echo '::error::Model runtime is present in the release dependency graph'
            exit 1
          fi
          # --no-default-features is a Cargo flag, forwarded after Tauri's --.
          npm run tauri -- build --target universal-apple-darwin --bundles app,dmg -- --locked --no-default-features

      - name: Verify signed app, effective entitlements, version, and universal slices
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="$CARGO_TARGET_DIR/universal-apple-darwin/release/bundle/macos/Voxi.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --verbose=4 "$APP" 2> "$RUNNER_TEMP/voxi-codesign.txt"
          cat "$RUNNER_TEMP/voxi-codesign.txt"
          grep -F "Authority=$SIGNING_IDENTITY" "$RUNNER_TEMP/voxi-codesign.txt"
          if [[ "$NOTARIZE" == true ]]; then grep -Fx "TeamIdentifier=$APPLE_TEAM_ID" "$RUNNER_TEMP/voxi-codesign.txt"; fi
          grep -E 'flags=.*\(runtime\)' "$RUNNER_TEMP/voxi-codesign.txt"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/voxi-entitlements.plist"
          cat "$RUNNER_TEMP/voxi-entitlements.plist"
          python3 - <<'PY'
          import os, pathlib, plistlib
          data = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'voxi-entitlements.plist').read_bytes()
          assert not data.strip() or not plistlib.loads(data), 'Unexpected effective entitlements; review before publishing'
          app = pathlib.Path(os.environ['CARGO_TARGET_DIR']) / 'universal-apple-darwin/release/bundle/macos/Voxi.app'
          info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
          assert info['CFBundleShortVersionString'] == os.environ['VERSION']
          assert info['CFBundleVersion'] == os.environ['VERSION']
          forbidden = {'.gguf', '.safetensors', '.onnx', '.pt', '.pth', '.tflite'}
          for path in app.rglob('*'):
              assert path.suffix.lower() not in forbidden, f'Model file bundled: {path}'
              assert path.name.lower() not in {'tokenizer.json', 'tokenizer.model', 'pytorch_model.bin', 'model.bin'}, f'Model file bundled: {path}'
          PY
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/voxi")
          echo "$ARCHS"
          [[ " $ARCHS " == *" arm64 "* && " $ARCHS " == *" x86_64 "* ]]
          if [[ "$NOTARIZE" == true ]]; then
            xcrun stapler validate "$APP"
            spctl --assess --type execute --verbose=4 "$APP"
          fi

      - name: Notarize, staple, and verify the distribution DMG
        if: env.NOTARIZE == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          DMG="$CARGO_TARGET_DIR/universal-apple-darwin/release/bundle/dmg/Voxi_${VERSION}_universal.dmg"
          codesign --verify --strict --verbose=2 "$DMG"
          xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/voxi-dmg-notary.json"
          cat "$RUNNER_TEMP/voxi-dmg-notary.json"
          python3 - <<'PY'
          import json, os, pathlib
          result = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'voxi-dmg-notary.json').read_text())
          assert result['status'] == 'Accepted', result
          PY
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          codesign --verify --deep --strict --verbose=2 "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"

      - name: Prepare verified release assets and updater manifest
        run: |
          mkdir -p "$RUNNER_TEMP/voxi-release"
          BUNDLE="$CARGO_TARGET_DIR/universal-apple-darwin/release/bundle"
          cp "$BUNDLE/dmg/Voxi_${VERSION}_universal.dmg" "$BUNDLE/macos/Voxi.app.tar.gz" "$BUNDLE/macos/Voxi.app.tar.gz.sig" "$RUNNER_TEMP/voxi-release/"
          # Verify the actual updater payload as well as the standalone app.
          mkdir -p "$RUNNER_TEMP/voxi-updater-check"
          tar -xzf "$BUNDLE/macos/Voxi.app.tar.gz" -C "$RUNNER_TEMP/voxi-updater-check"
          UPDATE_APP="$RUNNER_TEMP/voxi-updater-check/Voxi.app"
          codesign --verify --deep --strict --verbose=2 "$UPDATE_APP"
          if [[ "$NOTARIZE" == true ]]; then xcrun stapler validate "$UPDATE_APP"; fi
          cmp "$UPDATE_APP/Contents/MacOS/voxi" "$BUNDLE/macos/Voxi.app/Contents/MacOS/voxi"
          python3 - <<'PY'
          import datetime, json, os, pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          assets = temp / 'voxi-release'
          signature = (assets / 'Voxi.app.tar.gz.sig').read_text().strip()
          assert signature, 'Updater signature missing'
          notes = (temp / 'voxi-updater-notes.md').read_text().strip()
          assert notes, 'Updater release notes missing'
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/v{os.environ['VERSION']}/Voxi.app.tar.gz"
          manifest = {'version': os.environ['VERSION'], 'notes': notes,
                      'pub_date': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z'),
                      'platforms': {f'darwin-{arch}': {'signature': signature, 'url': url} for arch in ('aarch64', 'x86_64')}}
          (assets / 'latest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          if [[ "$NOTARIZE" != true ]]; then
            printf '\nThis build is not notarized yet. The first time you open it, macOS will block it: open System Settings → Privacy & Security, scroll down and click Open Anyway next to the Voxi message.\n' >> "$RUNNER_TEMP/voxi-release-notes.md"
          fi

      # This is the first step permitted to create/upload/publish a GitHub release.
      # Stage as draft so all assets (especially latest.json) exist before visibility.
      - name: Upload verified assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failed earlier run can leave an untagged draft with this version.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            gh release delete "v$VERSION" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "v$VERSION" "$RUNNER_TEMP/voxi-release/"* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Voxi $VERSION" --notes-file "$RUNNER_TEMP/voxi-release-notes.md" --draft
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Remove temporary signing material and restore keychains
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, shlex, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          original = temp / 'voxi-original-keychains'
          try:
              if original.exists():
                  subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *shlex.split(original.read_text())], check=True)
          finally:
              try:
                  kc = temp / 'voxi-signing.keychain-db'
                  if kc.exists():
                      subprocess.run(['security', 'delete-keychain', str(kc)], check=True)
              finally:
                  for name in ('voxi-signing.p12', 'voxi-notary.p8', 'voxi-original-keychains'):
                      (temp / name).unlink(missing_ok=True)
          PY
